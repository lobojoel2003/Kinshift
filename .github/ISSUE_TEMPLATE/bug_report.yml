name: Bug report
description: Something in Kinshift isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. **Never paste real health information, invite links or secrets into an issue.**
        Security problems go through private reporting instead: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Meds page
        2. Tap “Given” on the 8:00 AM dose
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kinshift version and build
      description: Shown in Account settings → About Kinshift, or at /api/health
      placeholder: 1.0.0 (build 42)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run Kinshift?
      options: [Docker / Docker Compose, Render, Node.js bundle, From source, Other]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari, installed to Home Screen
  - type: textarea
    id: logs
    attributes:
      label: Server logs
      description: Anything relevant from `docker logs kinshift`. Remove personal details first.
      render: shell
