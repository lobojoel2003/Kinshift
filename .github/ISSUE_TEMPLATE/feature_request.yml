name: Feature request
description: Suggest something that would make caregiving easier
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the caregiving situation. Who is involved and what goes wrong today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Kinshift to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
