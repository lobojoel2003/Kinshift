name: Release

# Two ways to publish a release:
#   1. npm run release:patch (or :minor / :major), then git push --follow-tags
#   2. Actions → Release → Run workflow, and enter the tag (for example v1.0.1).
#      The tag is created on the selected branch if it does not exist yet.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, e.g. v1.0.0 (must match package.json)"
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kinshift
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  prepare:
    name: Check version and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        name: Tag must match package.json and CHANGELOG.md
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag like v1.2.3"
            exit 1
          fi
          VERSION="${TAG#v}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout -q "$TAG"
          elif [ "$EVENT" != "workflow_dispatch" ]; then
            echo "::error::Tag $TAG not found"
            exit 1
          fi
          PKG=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG"
            exit 1
          fi
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git config user.name "$ACTOR"
            git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"
            git tag -a "$TAG" -m "Kinshift $VERSION" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
            echo "Created tag $TAG at $GITHUB_SHA"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  test:
    name: Test
    needs: prepare
    uses: ./.github/workflows/ci.yml

  image:
    name: Publish Docker image
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }},enable=${{ needs.prepare.outputs.prerelease == 'false' }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.tag }},enable=${{ needs.prepare.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease == 'false' }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Kinshift
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Build date
        id: date
        run: echo "now=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            KINSHIFT_BUILD_NUMBER=${{ github.run_number }}
            KINSHIFT_COMMIT_SHA=${{ github.sha }}
            KINSHIFT_BUILD_DATE=${{ steps.date.outputs.now }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  bundle:
    name: Build Node.js bundle
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          KINSHIFT_BUILD_NUMBER: ${{ github.run_number }}
          KINSHIFT_COMMIT_SHA: ${{ github.sha }}
      - name: Package standalone server
        run: |
          NAME="kinshift-${{ needs.prepare.outputs.version }}-node"
          mkdir -p "dist/$NAME"
          cp -r .next/standalone/. "dist/$NAME/"
          mkdir -p "dist/$NAME/.next"
          cp -r .next/static "dist/$NAME/.next/static"
          cp -r public drizzle "dist/$NAME/"
          cp LICENSE README.md CHANGELOG.md .env.example "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt

  release:
    name: GitHub release
    needs: [prepare, image, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<NOTES

          ## Install

          **Docker** (amd64 and arm64)

          \`\`\`bash
          docker run -d --name kinshift -p 3000:3000 -v kinshift-data:/data ${{ env.IMAGE }}:$VERSION
          \`\`\`

          **Node.js 22+**: download \`kinshift-$VERSION-node.tar.gz\`, extract it and run \`node server.js\`.

          Build ${{ github.run_number }} · commit \`${GITHUB_SHA::7}\` · image digest \`${{ needs.image.outputs.digest }}\`
          NOTES
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Kinshift ${{ needs.prepare.outputs.tag }}
          body_path: notes.md
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'false' }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
