name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint, types & unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Formatting
        run: npm run format:check
      - name: Unit and integration tests
        run: npm run test:coverage
      - name: Upload coverage
        if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
        env:
          KINSHIFT_BUILD_NUMBER: ${{ github.run_number }}
          KINSHIFT_COMMIT_SHA: ${{ github.sha }}
      - name: Playwright
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kinshift:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=ci
            KINSHIFT_BUILD_NUMBER=${{ github.run_number }}
            KINSHIFT_COMMIT_SHA=${{ github.sha }}
      - name: Start container and wait until healthy
        run: |
          docker run -d --name kinshift -p 3000:3000 -e KINSHIFT_SECRET="$(openssl rand -hex 32)" kinshift:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' kinshift)
            echo "health: $status"
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health | tee health.json
          grep -q '"status":"ok"' health.json
          curl -fsS -o /dev/null -w "login page: %{http_code}\n" http://localhost:3000/login
          test "$(docker exec kinshift id -u)" = "1001"
      - name: Container logs
        if: always()
        run: docker logs kinshift || true
